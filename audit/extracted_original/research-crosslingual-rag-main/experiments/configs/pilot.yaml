project:
  topic: "Separating Translation-Fidelity and Verifier-Reasoning Errors in Cross-Lingual RAG"
  seed: 17
  free_tools_only: true
  paid_api_calls: false
pilot:
  target_examples: 100
  initial_language_pair: "English-Hindi"
  labels: [SUPPORTED, CONTRADICTED, INSUFFICIENT_EVIDENCE]
  conditions: [original_evidence, machine_translated_evidence, human_corrected_translation]
  note: "Do not run before literature, license, resource and annotation gates."
resources:
  auto_detect: true
  max_model_download_gb_without_approval: 2
  max_dataset_download_gb_without_approval: 1
evaluation:
  group_splits_by_claim_or_source: true
  confidence_intervals: true
  test_labels_for_threshold_tuning: false
